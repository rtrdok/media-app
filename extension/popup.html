<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      margin: 0;
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
      background: #0b1020;
      color: #e2e8f0;
      width: 320px;
      padding: 14px;
    }
    h1 { margin: 0 0 4px; font-size: 15px; }
    .hint { margin: 0 0 12px; color: #94a3b8; font-size: 12px; }
    .btns { display: flex; flex-direction: column; gap: 8px; }
    button {
      width: 100%;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    fieldset {
      margin: 0 0 12px;
      padding: 10px 10px 8px;
      border: 1px solid #1e293b;
      border-radius: 8px;
    }
    legend {
      padding: 0 4px;
      color: #94a3b8;
      font-size: 11px;
    }
    .row {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .row:last-child { margin-bottom: 0; }
    label { color: #cbd5e1; font-size: 12px; }
    select {
      width: 100%;
      height: 32px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      padding: 0 8px;
    }
    #prefs-saved {
      margin: 6px 0 0;
      min-height: 14px;
      color: #86efac;
      font-size: 11px;
    }
    #status {
      margin-top: 10px;
      white-space: pre-wrap;
      color: #94a3b8;
      font-size: 12px;
    }
    #status.ok { color: #86efac; }
    #status.err { color: #fca5a5; }
  </style>
</head>
<body>
  <h1>Media App</h1>
  <p class="hint">Настройки сохраняются и применяются ко всем следующим ссылкам.</p>

  <fieldset>
    <legend>Скачивание по умолчанию</legend>
    <div class="row">
      <label for="kind">Тип</label>
      <select id="kind">
        <option value="auto">Авто</option>
        <option value="video">Видео</option>
        <option value="audio">Аудио</option>
      </select>
    </div>
    <div class="row">
      <label for="quality">Качество</label>
      <select id="quality">
        <option value="best">Лучшее</option>
        <option value="2160">2160p</option>
        <option value="1440">1440p</option>
        <option value="1080">1080p</option>
        <option value="720">720p</option>
        <option value="480">480p</option>
        <option value="360">360p</option>
      </select>
    </div>
    <div class="row">
      <label for="fmt">Формат</label>
      <select id="fmt">
        <option value="MP4">MP4</option>
        <option value="MKV">MKV</option>
        <option value="WEBM">WEBM</option>
        <option value="MOV">MOV</option>
        <option value="MP3">MP3 (аудио)</option>
      </select>
    </div>
    <div id="prefs-saved"></div>
  </fieldset>

  <div class="btns">
    <button id="send-job" type="button">Отправить в Media App</button>
    <button id="send-cookies" class="secondary" type="button">Отправить cookies</button>
  </div>
  <div id="status"></div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
