<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      margin: 0;
      font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
      background: #0b1020;
      color: #e2e8f0;
      width: 300px;
      padding: 14px;
    }
    h1 { margin: 0 0 6px; font-size: 15px; }
    p { margin: 0 0 12px; color: #94a3b8; }
    .btns { display: flex; flex-direction: column; gap: 8px; }
    button {
      width: 100%;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    #status {
      margin-top: 10px;
      white-space: pre-wrap;
      color: #94a3b8;
      font-size: 12px;
    }
    #status.ok { color: #86efac; }
    #status.err { color: #fca5a5; }
  </style>
</head>
<body>
  <h1>Media App</h1>
  <p>Отправь текущую вкладку в очередь или обнови cookies.</p>
  <div class="btns">
    <button id="send-job" type="button">Отправить в Media App</button>
    <button id="send-cookies" class="secondary" type="button">Отправить cookies</button>
  </div>
  <div id="status"></div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
